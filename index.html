<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>FORMU1A — Intro Prototype v0.9.1</title>
<style>
:root{--red:#c8102e;--accent:#ed1c2e;--black:#050505;--white:#f5f5f5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--white);font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100%;height:100svh;min-height:480px;overflow:hidden;background:#050505;isolation:isolate}
#ripCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;display:block}
.logo{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font-size:clamp(42px,10vw,100px);font-weight:1000;letter-spacing:.045em;line-height:1;color:#f7f7f7;opacity:0;transition:top .95s cubic-bezier(.2,.8,.2,1),font-size .95s,opacity .45s}
.logo.visible{opacity:1}.logo .one{color:#f7f7f7;transition:color .45s}.logo.final .one{color:var(--accent)}.logo.parked{top:23%;font-size:clamp(38px,8.5vw,84px)}
.loading{position:absolute;z-index:6;left:clamp(24px,7vw,100px);right:clamp(24px,7vw,100px);top:calc(50% + clamp(48px,7vh,78px));opacity:0;visibility:hidden;transition:opacity .5s}
.loading.show{opacity:1;visibility:visible}.load-row{display:flex;justify-content:space-between;gap:12px;color:#92929b;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
.track{height:3px;background:#29292e;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);box-shadow:0 0 12px #ed1c2e88;transition:width .08s linear}
.menu{position:absolute;z-index:7;left:clamp(22px,7vw,96px);right:clamp(22px,7vw,96px);bottom:clamp(24px,7vh,76px);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .7s,transform .7s}
.menu.show{opacity:1;transform:translateY(0);pointer-events:auto}.menu button{display:flex;gap:14px;align-items:center;min-height:47px;padding:12px 14px;text-align:left;border:1px solid #ffffff20;background:#101014dd;color:#777;cursor:not-allowed}
.menu button:first-child{min-height:55px;background:#ed1c2e18;border-color:#ed1c2e66}.num{color:var(--accent);font-size:11px;font-weight:800}.label{flex:1;font-size:12px;font-weight:800;letter-spacing:.12em}.lock{font-size:12px;color:#555}
@media(max-width:600px){.menu{left:22px;right:22px;bottom:clamp(22px,5vh,46px);gap:6px}.menu button{min-height:41px;padding:9px 12px}.menu button:first-child{min-height:46px}.loading{top:calc(50% + 45px)}}
@media(prefers-reduced-motion:reduce){.loading,.logo,.logo .one,.menu{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="ripCanvas" aria-hidden="true"></canvas>
  <h1 class="logo" id="logo">FORMU<span class="one" id="one">1</span>A</h1>
  <section class="loading" id="loading" aria-label="Loading game">
    <div class="load-row"><span id="loadText">INITIALIZING PADDOCK</span><span id="percent">0%</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </section>
  <nav class="menu" id="menu" aria-label="Main menu">
    <button disabled><span class="num">01</span><span class="label">START</span><span class="lock">🔒</span></button>
    <button disabled><span class="num">02</span><span class="label">LOAD CAREER</span><span class="lock">🔒</span></button>
    <button disabled><span class="num">03</span><span class="label">EDIT DRIVER &amp; LIVERY</span><span class="lock">🔒</span></button>
    <button disabled><span class="num">04</span><span class="label">SETTINGS</span><span class="lock">🔒</span></button>
    <button disabled><span class="num">05</span><span class="label">QUIT</span><span class="lock">🔒</span></button>
  </nav>
</main>
<script>
(()=>{
const canvas=document.getElementById('ripCanvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),logo=document.getElementById('logo'),loading=document.getElementById('loading'),menu=document.getElementById('menu');
const fill=document.getElementById('fill'),percent=document.getElementById('percent'),loadText=document.getElementById('loadText');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,dpr=1,start=0,raf=0,done=false,audioCtx=null,audioStarted=false;
const RED='#c8102e',mask=document.createElement('canvas'),mctx=mask.getContext('2d');
const cars=[
{name:'KART',x:.14,color:'#ff9c39',speed:.48,delay:.20,pitch:145,type:'kart'},
{name:'F4',x:.29,color:'#24d36d',speed:.67,delay:.48,pitch:105,type:'formula'},
{name:'F3',x:.44,color:'#f3f3f3',speed:.82,delay:.72,pitch:82,type:'formula'},
{name:'F2',x:.60,color:'#2d69ff',speed:.98,delay:.94,pitch:66,type:'formula'},
{name:'F1',x:.76,color:'#ff2438',speed:1.18,delay:1.12,pitch:52,type:'formula'},
{name:'F1',x:.88,color:'#ffd84a',speed:1.26,delay:1.28,pitch:48,type:'formula'}];
function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=mask.width=Math.round(W*dpr);canvas.height=mask.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);mctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function drawCar(c,x,y,s,color,type){
 c.save();c.translate(x,y);const w=s,l=s*(type==='kart'?1.08:1.72);c.fillStyle='#08090c';
 if(type==='kart'){rounded(c,-w*.48,-l*.27,w*.23,l*.35,w*.07);rounded(c,w*.25,-l*.27,w*.23,l*.35,w*.07);rounded(c,-w*.48,l*.04,w*.23,l*.35,w*.07);rounded(c,w*.25,l*.04,w*.23,l*.35,w*.07);c.fillStyle='#777';rounded(c,-w*.10,-l*.4,w*.20,l*.78,w*.08);c.fillStyle=color;rounded(c,-w*.18,-l*.28,w*.36,l*.52,w*.09);c.fillStyle='#f1c7a0';c.beginPath();c.arc(0,-l*.12,w*.13,0,Math.PI*2);c.fill();c.fillStyle='#20232b';c.beginPath();c.arc(0,-l*.12,w*.105,0,Math.PI*2);c.fill()}
 else{rounded(c,-w*.56,-l*.30,w*.24,l*.28,w*.07);rounded(c,w*.32,-l*.30,w*.24,l*.28,w*.07);rounded(c,-w*.56,l*.05,w*.24,l*.28,w*.07);rounded(c,w*.32,l*.05,w*.24,l*.28,w*.07);c.fillStyle=color;rounded(c,-w*.66,-l*.37,w*1.32,l*.10,w*.04);c.beginPath();c.moveTo(-w*.28,-l*.32);c.lineTo(w*.28,-l*.32);c.lineTo(w*.21,l*.28);c.lineTo(-w*.21,l*.28);c.closePath();c.fill();c.fillStyle='#171a20';c.beginPath();c.moveTo(-w*.18,-l*.22);c.lineTo(w*.18,-l*.22);c.lineTo(w*.12,l*.22);c.lineTo(-w*.12,l*.22);c.closePath();c.fill();c.fillStyle='#bfc8d3';rounded(c,-w*.105,-l*.08,w*.21,l*.22,w*.08);c.fillStyle=color;rounded(c,-w*.62,l*.33,w*1.24,l*.09,w*.03)}
 c.restore()}
function initRedSheet(){mctx.clearRect(0,0,W,H);mctx.fillStyle=RED;mctx.fillRect(0,0,W,H);mctx.globalAlpha=.1;mctx.fillStyle='#ff5369';for(let i=0;i<12;i++)mctx.fillRect(0,i/12*H,W,1);mctx.globalAlpha=1}
function cutTrail(x,y,width){const edge=Math.max(7,width*.42),wobble=Math.max(3,width*.19),bottom=H+5;mctx.save();mctx.globalCompositeOperation='destination-out';mctx.beginPath();mctx.moveTo(x-edge,y);const steps=Math.max(8,Math.ceil((bottom-y)/32));for(let i=0;i<=steps;i++){const yy=y+(bottom-y)*i/steps;mctx.lineTo(x+(i%2===0?-1:1)*(edge+Math.sin(i*2.1)*wobble),yy)}for(let i=steps;i>=0;i--){const yy=y+(bottom-y)*i/steps;mctx.lineTo(x+(i%2===0?1:-1)*(edge+Math.cos(i*1.7)*wobble),yy)}mctx.closePath();mctx.fill();mctx.restore()}
function position(car,t){const elapsed=t-car.delay;if(elapsed<0)return null;const p=Math.min(1,elapsed/(2.5/car.speed));return{x:car.x*W+Math.sin(elapsed*2+car.x*9)*W*.003,y:H+95-p*(H+190),s:Math.max(12,Math.min(W*.075,car.name==='KART'?W*.047:W*.066))}}
function paint(now){const elapsed=(now-start)/1000;ctx.clearRect(0,0,W,H);for(const car of cars){const p=position(car,elapsed);if(p)cutTrail(p.x,p.y,p.s*.74)}ctx.drawImage(mask,0,0,mask.width,mask.height,0,0,W,H);for(const car of cars){const p=position(car,elapsed);if(!p)continue;ctx.save();ctx.globalAlpha=.45;ctx.strokeStyle=car.color;ctx.lineWidth=Math.max(1,p.s*.045);ctx.beginPath();ctx.moveTo(p.x,p.y+p.s);ctx.lineTo(p.x,p.y+p.s*2);ctx.stroke();ctx.restore();drawCar(ctx,p.x,p.y,p.s,car.color,car.type)}if(elapsed>3.8)logo.classList.add('visible');if(elapsed>4.55&&!done){done=true;finishIntro();return}raf=requestAnimationFrame(paint)}
function finishIntro(){cancelAnimationFrame(raf);ctx.clearRect(0,0,W,H);canvas.style.display='none';logo.classList.add('visible');loading.classList.add('show');const duration=reduce?300:3000,t0=performance.now();function load(now){const p=Math.min(1,(now-t0)/duration),n=Math.round(p*100);fill.style.width=n+'%';percent.textContent=n+'%';if(p>.72)loadText.textContent='READY FOR LIGHTS OUT';if(p<1)requestAnimationFrame(load);else{logo.classList.add('final');setTimeout(()=>{logo.classList.add('parked');loading.classList.remove('show');setTimeout(()=>menu.classList.add('show'),450)},500)}}requestAnimationFrame(load)}
function startAudio(){if(audioStarted)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audioCtx=new AC();const master=audioCtx.createGain();master.gain.value=.14;master.connect(audioCtx.destination);const now=audioCtx.currentTime;cars.forEach((car,i)=>{const when=now+car.delay,o=audioCtx.createOscillator(),h=audioCtx.createOscillator(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain(),pan=audioCtx.createStereoPanner(),base=car.pitch;o.type='sawtooth';h.type='triangle';o.frequency.setValueAtTime(base,when);o.frequency.exponentialRampToValueAtTime(base*(car.name==='F1'?4.8:car.name==='KART'?3.4:4),when+.8/car.speed);o.frequency.exponentialRampToValueAtTime(base*1.2,when+2.25/car.speed);h.frequency.setValueAtTime(base*1.98,when);h.frequency.exponentialRampToValueAtTime(base*5.2,when+.8/car.speed);h.frequency.exponentialRampToValueAtTime(base*1.5,when+2.25/car.speed);f.type='lowpass';f.frequency.setValueAtTime(car.name==='KART'?2800:2200,when);f.frequency.exponentialRampToValueAtTime(520,when+2.2/car.speed);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(car.name==='F1'?.07:.05,when+.18);g.gain.exponentialRampToValueAtTime(.0001,when+2.3/car.speed);pan.pan.setValueAtTime(-.8+i/(cars.length-1)*1.6,when);pan.pan.linearRampToValueAtTime(.8-i/(cars.length-1)*1.6,when+2.2/car.speed);o.connect(f);h.connect(f);f.connect(g);g.connect(pan);pan.connect(master);o.start(when);h.start(when);o.stop(when+2.4/car.speed);h.stop(when+2.4/car.speed)});audioStarted=true;if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}catch(e){}}
function resumeAudio(){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}
document.addEventListener('pointerdown',resumeAudio,{passive:true});document.addEventListener('keydown',resumeAudio);
initRedSheet();startAudio();start=performance.now();raf=requestAnimationFrame(paint);
})();
</script>
</body>
</html>
