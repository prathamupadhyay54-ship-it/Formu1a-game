<title>FORMU1A — Intro Prototype v0.9.4</title>
<style>
:root{--red:#c8102e;--accent:#ed1c2e;--black:#050505;--white:#f5f5f5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--white);font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100%;height:100svh;min-height:480px;overflow:hidden;background:#050505;isolation:isolate}
#ripCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;display:block}
.logo{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font-size:clamp(42px,10vw,100px);font-weight:1000;letter-spacing:.045em;line-height:1;color:#f7f7f7;opacity:1;transition:top .95s cubic-bezier(.2,.8,.2,1),font-size .95s,opacity .45s}
.logo.visible{opacity:1}.logo .one{color:#f7f7f7;transition:color .45s}.logo.final .one{color:var(--accent)}.logo.parked{top:4%;font-size:clamp(38px,8.5vw,84px)}
.loading{position:absolute;z-index:6;left:clamp(24px,7vw,100px);right:clamp(24px,7vw,100px);top:calc(50% + clamp(100px,12vh,132px));opacity:0;visibility:hidden;transition:opacity .65s,visibility .65s}
.loading.show{opacity:1;visibility:visible}.load-row{display:flex;justify-content:space-between;gap:12px;color:#92929b;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
.track{height:3px;background:#29292e;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);box-shadow:0 0 12px #ed1c2e88;transition:width .08s linear}
.menu{position:absolute;z-index:7;left:clamp(22px,7vw,96px);right:clamp(22px,7vw,96px);bottom:clamp(24px,7vh,76px);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .7s,transform .7s}
.menu.show{opacity:1;transform:translateY(0);pointer-events:auto}.menu button{display:flex;gap:14px;align-items:center;min-height:47px;padding:12px 14px;text-align:left;border:1px solid #ffffff20;background:#101014dd;color:#777;cursor:not-allowed}
.menu button:first-child{min-height:55px;background:#ed1c2e18;border-color:#ed1c2e66}.num{color:var(--accent);font-size:11px;font-weight:800}.label{flex:1;font-size:12px;font-weight:800;letter-spacing:.12em}.lock{font-size:12px;color:#555}
@media(max-width:600px){.menu{left:22px;right:22px;bottom:clamp(22px,5vh,46px);gap:6px}.menu button{min-height:41px;padding:9px 12px}.menu button:first-child{min-height:46px}.loading{top:calc(50% + 100px)}}
@media(prefers-reduced-motion:reduce){.loading,.logo,.logo .one,.menu{transition-duration:.01ms!important}}
</style>
</head>
